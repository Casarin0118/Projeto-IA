<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Perfil</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1c1c1c, #2b2b2b, #3a3a3a);
            color: #f5f5f5;
            min-height: 100vh;
        }

        /* Ajustando a barra de navegação para o mesmo tamanho da primeira tela */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(20, 20, 20, 0.95);
            padding: 20px 60px; /* Aumentei o padding para ficar mais espessa */
            height: 80px; /* Ajustei a altura da barra */
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
            position: sticky;
            top: 0;
            z-index: 10;
            font-family: "Montserrat", sans-serif;
        }

        .logo {
            font-weight: 700;
            font-size: 24px;
            color: #f5f5f5;
            letter-spacing: 1px;
        }

        nav a {
            margin: 0 18px;
            text-decoration: none;
            color: #ddd;
            font-size: 16px;
            font-weight: 500;
            transition: color 0.3s ease, transform 0.2s ease;
        }

        nav a:hover {
            color: #b71c1c;
            transform: translateY(-2px);
        }

        nav .btn {
            background: linear-gradient(135deg, #b71c1c, #8b0000);
            color: #fff;
            padding: 8px 14px;
            border-radius: 25px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        nav .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(183, 28, 28, 0.5);
        }

        main {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            padding: 40px 20px;
        }

        .card {
            background: #222;
            padding: 30px 40px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.7);
            max-width: 500px;
            width: 100%;
        }

        h2 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 24px;
            margin-bottom: 25px;
            text-align: center;
            color: #e5e5e5;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #555;
            border-radius: 8px;
            font-size: 15px;
            background: #2e2e2e;
            color: #f5f5f5;
            font-family: "Inter", sans-serif;
            transition: 0.3s;
        }

        input:focus, textarea:focus {
            border-color: #b71c1c;
            outline: none;
            box-shadow: 0 0 8px rgba(183, 28, 28, 0.5);
        }

        textarea {
            resize: none;
            height: 120px;
        }

        .botoes {
            display: flex;
            justify-content: space-between;
        }

        .botoes button {
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            font-family: "Montserrat", sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .botoes .cancelar {
            background: #555;
            color: #fff;
        }

        .botoes .salvar {
            background: linear-gradient(135deg, #b71c1c, #8b0000);
            color: white;
        }

        .botoes .cancelar:hover {
            background: #777;
        }

        .botoes .salvar:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(183, 28, 28, 0.5);
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
                align-items: flex-start;
            }

            nav {
                margin-top: 10px;
            }

            .botoes {
                flex-direction: column;
                gap: 10px;
            }

            .botoes button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">Logo do Site</div>
        <nav>
            <a href="{{ url_for('index') }}">Início</a>
            <a href="{{ url_for('como_funciona') }}">Como funciona</a>
            <a href="{{ url_for('empresa') }}">Empresa</a>
            <a class="btn" href="{{ url_for('cadastrar') }}">Cadastrar perfil</a>
        </nav>
    </header>

    <main>
        <div class="card">
            <h2>Cadastrar perfil</h2>
            <form action="{{ url_for('cadastrar') }}" method="POST">
                <input type="text" name="titulo" placeholder="Digite um título" required>
                <textarea name="descricao" placeholder="Escreva a descrição..." required></textarea>
                <div class="botoes">
                    <button type="reset" class="cancelar">Cancelar</button>
                    <button type="submit" class="salvar">Salvar</button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
