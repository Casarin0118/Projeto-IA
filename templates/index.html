<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Registo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <div class="form-container" id="login-form">
            <h1>Login</h1>
            <form id="login-form-element" action="/login" method="POST">
                <div class="input-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" name="email" required>
                </div>
                <div class="input-group">
                    <label for="login-password">Palavra-passe</label>
                    <input type="password" id="login-password" name="password" required>
                </div>
                <button type="submit" class="btn">Entrar</button>
            </form>
            <p class="toggle-text">Não tem uma conta? <a href="#" id="show-register">Registe-se</a></p>
        </div>

        <div class="form-container hidden" id="register-form">
            <h1>Registo</h1>
            <form id="register-form-element" action="/register" method="POST">
                <div class="input-group">
                    <label for="register-username">Nome de Utilizador</label>
                    <input type="text" id="register-username" name="username" required>
                </div>
                <div class="input-group">
                    <label for="register-email">Email</label>
                    <input type="email" id="register-email" name="email" required>
                </div>
                <div class="input-group">
                    <label for="register-password">Palavra-passe</label>
                    <input type="password" id="register-password" name="password" required>
                </div>
                <button type="submit" class="btn">Registar</button>
            </form>
            <p class="toggle-text">Já tem uma conta? <a href="#" id="show-login">Faça Login</a></p>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
